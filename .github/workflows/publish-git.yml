name: publish-git
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish-git:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Publish with Gradle
        env:
          ORG_GRADLE_PROJECT_WapicMavenRepoUsername: ${{secrets.MAVEN_NAME}}
          ORG_GRADLE_PROJECT_WapicMavenRepoPassword: ${{secrets.MAVEN_SECRET}}
        run: ./gradlew publish -Psha=${{github.sha}} --stacktrace