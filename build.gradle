import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
	id 'idea'
	id 'java'
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.1.21"
	id "com.gradleup.shadow" version "8.3.4"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.notenoughupdates.org/releases/" }
	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
	maven { url = "https://repo.nea.moe/releases" }
}

configurations {
	shadowModImpl
	shadowImpl
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	modImplementation "net.hypixel:mod-api:1.0.1"

	modRuntimeOnly "me.djtheredstoner:DevAuth-fabric:${project.devauth_version}"

	shadowModImpl "org.notenoughupdates.moulconfig:modern-1.21.5:4.0.1-beta"
	shadowImpl "moe.nea:libautoupdate:1.3.1"

	configurations.shadowModImpl.dependencies.each {
		modImplementation(it)
	}

	configurations.shadowImpl.dependencies.each {
		implementation(it)
	}
}

tasks.withType(ShadowJar).configureEach {
	configurations = [project.configurations.shadowModImpl]
	relocate('io.github.notenoughupdates.moulconfig', 'net.wapic.wpcmod.deps.moulconfig')
	relocate('net.hypixel', 'net.wapic.wpcmod.deps.hypixel')
	relocate('moe.nea', 'net.wapic.wpcmod.deps.libautoupdate')
	doLast {
		configurations.forEach {
			println("Config: ${it.files}")
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			groupId = project.maven_group
			version = project.mod_version + project.properties.getOrDefault("sha", "")
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			name = "WapicMavenRepo"
			def repoUrl = 'https://maven.wapic.net/'
			url = "https://maven.wapic.net/${project.properties.get("sha") ? "snapshots": "releases"}"
			print("url: " + url)
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
}