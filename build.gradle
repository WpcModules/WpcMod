plugins {
	id 'idea'
	id 'java'
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.1.21"
	id "com.gradleup.shadow" version "8.3.4"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.notenoughupdates.org/releases/" }
	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
	maven { url = "https://repo.nea.moe/releases" }
}

configurations {
	shadowModImpl
	shadowImpl
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	modRuntimeOnly "me.djtheredstoner:DevAuth-fabric:${project.devauth_version}"

	shadowModImpl "org.notenoughupdates.moulconfig:modern-1.21.5:4.0.1-beta"
	shadowImpl "moe.nea:libautoupdate:1.3.1"

	modImplementation "net.hypixel:mod-api:1.0.1"
	include "net.hypixel:mod-api:1.0.1"

    modImplementation "moe.nea.jarvis:jarvis-api:1.1.4"
    include "moe.nea.jarvis:jarvis-fabric:1.1.4"
    modLocalRuntime "moe.nea.jarvis:jarvis-fabric:1.1.4"

	configurations.shadowModImpl.dependencies.each {
		modImplementation(it)
	}

	configurations.shadowImpl.dependencies.each {
		implementation(it)
	}
}

shadowJar {
	destinationDirectory.set(layout.buildDirectory.dir("badjars"))
	archiveClassifier.set("all-dev")
	configurations = [project.configurations.shadowModImpl] + [project.configurations.shadowImpl]
	doLast {
		configurations.forEach {
			println("Config: ${it.files}")
		}
	}
	exclude("META-INF/versions/**")
	mergeServiceFiles()
	relocate('io.github.notenoughupdates.moulconfig', 'net.wapic.wpcmod.deps.moulconfig')
	relocate('moe.nea', 'net.wapic.wpcmod.deps')
}

remapJar {
	archiveClassifier.set("")
	dependsOn shadowJar
	inputFile.set(tasks.shadowJar.archiveFile)
	destinationDirectory.set(rootProject.layout.buildDirectory.dir("libs"))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	archiveClassifier.set("nodeps")
}

tasks.assemble.dependsOn(tasks.remapJar)

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			groupId = project.maven_group
			version = project.mod_version + project.properties.getOrDefault("sha", "")
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			name = "WapicMavenRepo"
			url = "https://maven.wapic.net/${project.properties.get("sha") ? "snapshots": "releases"}"
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
}